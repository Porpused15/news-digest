name: Daily news digest

on:
  schedule:
    # Checks every hour; should_run.py decides whether it's time (send_hour in config.json,
    # Toronto time, once per day). Minute 17 avoids GitHub's top-of-hour congestion.
    - cron: "17 * * * *"
  workflow_dispatch: {}  # manual run / the app's "Send now" button: always runs

permissions:
  contents: write  # to commit digests/

concurrency:
  group: digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: gate
        if: github.event_name == 'schedule'
        run: python3 should_run.py

      - id: go
        run: echo "run=${{ github.event_name != 'schedule' || steps.gate.outputs.run == 'true' }}" >> "$GITHUB_OUTPUT"

      - if: steps.go.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - if: steps.go.outputs.run == 'true'
        run: pip install -r requirements.txt

      - if: steps.go.outputs.run == 'true'
        run: python news_digest.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}

      - if: steps.go.outputs.run == 'true'
        name: Commit digest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add digests
          git diff --cached --quiet && exit 0
          git commit -m "Digest $(TZ=America/Toronto date +%F)"
          for i in 1 2 3; do git pull --rebase -q && git push -q && exit 0; sleep 5; done
          exit 1
