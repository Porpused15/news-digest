name: Daily news digest

on:
  schedule:
    # Checks every hour; should_run.py decides whether it's time (send_hour in config.json,
    # Toronto time, once per day). Minute 17 avoids GitHub's top-of-hour congestion.
    - cron: "17 * * * *"
  workflow_dispatch: {}  # manual run / the app's "Send now" button: always runs

permissions:
  contents: write  # to commit digests/
  id-token: write  # GitHub OIDC token for Google Workload Identity Federation (no stored key)

concurrency:
  group: digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 40  # 4 Gemini attempts x 7 min + backoff
    env:
      # Settings live in a separate public repo so the app's token can't reach this code.
      CONFIG_PATH: settings/config.json
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: Porpused15/news-digest-config
          path: settings
          persist-credentials: false

      - id: gate
        if: github.event_name == 'schedule'
        run: python3 should_run.py

      - id: go
        run: echo "run=${{ github.event_name != 'schedule' || steps.gate.outputs.run == 'true' }}" >> "$GITHUB_OUTPUT"

      - if: steps.go.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - if: steps.go.outputs.run == 'true'
        run: pip install -r requirements.txt

      # Keyless login to Gemini Enterprise Agent Platform (formerly Vertex AI): GitHub's OIDC
      # token is exchanged for the news-digest service account (roles/aiplatform.user).
      # Only this repo may use the provider (attribute condition on assertion.repository).
      - if: steps.go.outputs.run == 'true'
        uses: google-github-actions/auth@v3
        with:
          project_id: gen-lang-client-0549571945
          workload_identity_provider: projects/820875145577/locations/global/workloadIdentityPools/github/providers/news-digest
          service_account: news-digest@gen-lang-client-0549571945.iam.gserviceaccount.com

      - if: steps.go.outputs.run == 'true'
        run: python news_digest.py
        env:
          GOOGLE_GENAI_USE_ENTERPRISE: "true"
          GOOGLE_CLOUD_LOCATION: global
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          GEMINI_FALLBACK_MODEL: ${{ vars.GEMINI_FALLBACK_MODEL }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}

      - if: steps.go.outputs.run == 'true'
        name: Commit digest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add digests
          git diff --cached --quiet && exit 0
          git commit -m "Digest $(TZ=America/Toronto date +%F)"
          for i in 1 2 3; do git pull --rebase -q && git push -q && exit 0; sleep 5; done
          exit 1
