name: Compare prompts (test only)

# Manual only. Fetches once and runs prompt/thinking variants on the same articles.
# No email, nothing committed: results are uploaded as a workflow artifact.
on:
  workflow_dispatch:
    inputs:
      variants:
        description: "Variants to run (A = current, B = reworded, C = reworded + high thinking)"
        default: "ABC"

permissions:
  contents: read
  id-token: write  # keyless Google login, same as the digest workflow

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CONFIG_PATH: settings/config.json
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/checkout@v4
        with:
          repository: Porpused15/news-digest-config
          path: settings
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - uses: google-github-actions/auth@v3
        with:
          project_id: gen-lang-client-0549571945
          workload_identity_provider: projects/820875145577/locations/global/workloadIdentityPools/github/providers/news-digest
          service_account: news-digest@gen-lang-client-0549571945.iam.gserviceaccount.com

      - run: python compare_prompts.py
        env:
          GOOGLE_GENAI_USE_ENTERPRISE: "true"
          GOOGLE_CLOUD_LOCATION: global
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          VARIANTS: ${{ inputs.variants }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compare
          path: compare/
